<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>八维空间 · 尺寸检查</title>
    <style>
      body {
        margin: 0;
        background: #282c2a;
        color: #f4f5ee;
        font: 14px/1.6 system-ui;
      }
      header {
        padding: 14px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 24px;
        flex-wrap: wrap;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      select {
        font: inherit;
        padding: 5px;
      }
      a {
        color: inherit;
      }
      main {
        display: flex;
        justify-content: center;
        padding: 10px 20px 25px;
        min-width: max-content;
      }
      iframe {
        width: 390px;
        height: 844px;
        background: #f3f4f0;
        border: 0;
        flex: none;
      }
    </style>
  </head>
  <body>
    <header>
      <label
        >宽度<select id="width">
          <option>320</option>
          <option selected>390</option>
          <option>768</option>
          <option>1024</option>
        </select></label
      ><label
        >页面<select id="page">
          <option value="">首页</option>
          <option value="events/military-2026/">军训详情</option>
          <option value="works/">作品筛选</option>
          <option value="people/">成员</option>
<option value="works/campus-photos/">照片详情</option><option value="works/military-photos/">军训图集</option>
<option value="about/">关于</option>
<option value="notes/broadcast-guide/">直播全文</option><option value="notes/full-review-guide/">回顾全文</option>
          <option value="notes/military-review/">复盘</option>
        </select></label
      ><a id="direct" href="./">直接打开</a
      ><output id="metrics" style="font-size: 12px; flex-basis: 100%; text-align: center"
        >检查中</output
      >
    </header>
    <main><iframe title="实际页面的窄屏检查" src="./"></iframe></main>
    <script>
      const params = new URLSearchParams(location.search),
        // The QA wrapper sits next to the site root, so its own directory is the
        // deployment base ("" locally, "/Eight-Dimensional-Space" on project Pages).
        base = location.pathname.replace(/responsive\.html$/, ''),
        widths = ['320', '390', '768', '1024'],
        pages = ['', 'events/military-2026/', 'works/', 'people/', 'notes/military-review/', 'works/campus-photos/', 'about/', 'notes/broadcast-guide/', 'notes/full-review-guide/', 'works/military-photos/'];
      const w = document.querySelector('#width'),
        p = document.querySelector('#page'),
        frame = document.querySelector('iframe');
      w.value = widths.includes(params.get('width')) ? params.get('width') : '390';
      p.value = pages.includes(params.get('page')) ? params.get('page') : '';
      function update() {
        frame.style.width = w.value + 'px';
        frame.src = base + p.value;
        document.querySelector('#direct').href = frame.src;
        const u = new URL(location.href);
        u.searchParams.set('width', w.value);
        u.searchParams.delete('skin');
        u.searchParams.set('page', p.value);
        history.replaceState(null, '', u);
      }
      window.addEventListener('message', (event) => {
        if (
          event.origin === location.origin &&
          event.source === frame.contentWindow &&
          event.data?.type === 'fieldwork-metrics'
        )
          document.querySelector('#metrics').textContent = JSON.stringify(event.data);
      });
      frame.addEventListener('load', () =>
        frame.contentWindow.postMessage('fieldwork-measure', location.origin),
      );
      [w, p].forEach((e) => e.addEventListener('change', update));
      update();
    </script>
  </body>
</html>
